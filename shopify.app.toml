client_id = "4930a421deb8b951cdd94f547b758da0"
name = "SmartCancel"
application_url = "https://smart-cancel.vercel.app"
embedded = true

[access_scopes]
scopes = "write_orders,read_orders,read_customers"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[app_proxy]
url = "https://smart-cancel.vercel.app/api/proxy"
subpath = "smartcancel"
prefix = "apps"

[auth]
redirect_urls = [ "https://smart-cancel.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true